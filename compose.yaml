services:
  postgres:
    image: postgres:17
    container_name: postgres-sql
    environment:
      POSTGRES_DB: library
      POSTGRES_USER: admin_library
      POSTGRES_PASSWORD: admin_library_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
